<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Switches — UI primitives</title>
<style>
@font-face{font-family:"Bricolage";src:url("../fonts/BricolageGrotesque.woff2") format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Instrument Serif";src:url("../fonts/InstrumentSerif-Italic.woff2") format("woff2");font-style:italic;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("../fonts/JetBrainsMono.woff2") format("woff2");font-weight:300 700;font-display:swap}
@font-face{font-family:"Pixelify";src:url("../fonts/PixelifySans.woff2") format("woff2");font-weight:400 700;font-display:swap}
:root{--bg:#0f0e13;--card:#1b1922;--line:#2a2733;--paper:#f4efe6;--muted:#a49cb3;--tomato:#ff5b3a;--sun:#ffc23d;--mint:#6fe3b5;--sky:#7fa8ff}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--paper);font:15px/1.5 "Bricolage",system-ui,sans-serif;padding:clamp(18px,4vw,56px)}
header{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:34px}
h1{margin:0;font:800 clamp(40px,5vw,76px)/.9 "Bricolage";letter-spacing:-.045em}
h1 em{font:400 1.1em/0 "Instrument Serif",serif;color:var(--sun)}
header p{margin:0;max-width:44ch;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.spec{position:relative;display:grid;grid-template-rows:1fr auto;min-height:420px;border-radius:20px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.spec .stage{display:grid;place-items:center;padding:30px;background:radial-gradient(circle,#ffffff0d 1px,transparent 1.5px) 0 0/18px 18px}
.spec footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-top:2px dashed var(--line)}
.spec footer b{font:700 18px "Bricolage";letter-spacing:-.02em}
.spec footer code{font:12px "JetBrains Mono";color:var(--muted)}
.state{font:12px "JetBrains Mono";color:var(--mint)}
:focus-visible{outline:3px solid var(--sun);outline-offset:4px}
svg.px{shape-rendering:crispEdges;display:block}

/* 1 · day / night */
.dn{position:relative;width:240px;height:110px;padding:0;border:0;border-radius:18px;cursor:pointer;overflow:hidden;background:#7fc4ff;box-shadow:inset 0 0 0 4px #0f0e13,0 8px 0 #0f0e13;transition:background-color .6s steps(6)}
.dn[aria-checked="true"]{background:#1d1640}
.dn .sky{position:absolute;inset:0;transition:transform .6s steps(8)}
.dn .stars{opacity:0;transition:opacity .6s steps(4)}
.dn[aria-checked="true"] .stars{opacity:1}
.dn[aria-checked="true"] .clouds{transform:translateY(-70px)}
.dn .clouds{transition:transform .6s steps(6)}
.dn .knob{position:absolute;top:15px;left:15px;width:80px;height:80px;transition:transform .6s steps(10)}
.dn[aria-checked="true"] .knob{transform:translateX(130px)}
.dn .moon{opacity:0}.dn[aria-checked="true"] .moon{opacity:1}.dn[aria-checked="true"] .sunpx{opacity:0}
.dn .sunpx,.dn .moon{transition:opacity .3s steps(3) .2s}
.dn .ground{position:absolute;left:0;right:0;bottom:0;height:12px;background:#3e7a4a;transition:background-color .6s steps(6)}
.dn[aria-checked="true"] .ground{background:#1d3a3a}

/* 2 · pull-cord lamp */
.lampwrap{position:relative;display:grid;justify-items:center}
.lampwrap svg{width:200px;height:230px}
.glow{position:absolute;top:110px;width:260px;height:180px;border-radius:50%;background:radial-gradient(closest-side,#ffc23d66,transparent);opacity:0;transition:opacity .25s steps(3);pointer-events:none}
.lampwrap.on .glow{opacity:1}
.cord{position:absolute;top:96px;left:calc(50% + 46px);width:20px;height:110px;padding:0;border:0;background:none;cursor:grab;transform-origin:top center}
.cord::before{content:"";position:absolute;left:9px;top:0;bottom:16px;width:2px;background:repeating-linear-gradient(#cfc8dc 0 4px,#8a8296 4px 8px)}
.cord::after{content:"";position:absolute;left:4px;bottom:0;width:12px;height:16px;background:var(--tomato);box-shadow:inset -3px -3px 0 #c93a20}
.cord.pull{animation:pull .45s steps(5)}
@keyframes pull{40%{transform:translateY(26px)}70%{transform:translateY(-4px)}}
.bulb{transition:fill .25s steps(2)}

/* 3 · cat checkbox */
.catbox{display:grid;gap:18px;justify-items:center}
.check{position:relative;display:flex;align-items:center;gap:14px;padding:0;border:0;background:none;color:var(--paper);font:600 17px "Bricolage";cursor:pointer}
.check .box{position:relative;width:64px;height:52px}
.check .box>svg:last-of-type{position:absolute;inset:auto 0 0 0;width:64px}
.check .cat{position:absolute;left:-74px;bottom:14px;width:56px;z-index:0;transition:transform .5s steps(6)}
.check .box>svg:last-of-type{z-index:1}
.check[aria-checked="true"] .cat{transform:translate(78px,-6px)}
.check .hop{animation:none}
.check[aria-checked="true"] .cat{animation:hop .5s steps(6)}
@keyframes hop{0%{transform:translate(0,0)}50%{transform:translate(40px,-34px)}100%{transform:translate(78px,-6px)}}
.zz{position:absolute;left:44px;top:-20px;font:14px "Pixelify";color:var(--sky);opacity:0;transition:opacity .3s .5s}
.check[aria-checked="true"] .zz{opacity:1;animation:zz 2s steps(4) .5s infinite}
@keyframes zz{50%{transform:translate(6px,-6px)}}
.catbox small{color:var(--muted);font:12px "JetBrains Mono"}
@media (max-width:1000px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><h1>Pixel <em>switches</em></h1><p>Three on/off controls that tell a tiny story when they change. Each is a real button with <code>role="switch"</code> or <code>role="checkbox"</code>, works with the keyboard and announces its state.</p></header>
<div class="grid">
  <article class="spec"><div class="stage">
    <button class="dn" role="switch" aria-checked="false" aria-label="Dark mode" id="dn">
      <span class="sky"><svg class="px stars" viewBox="0 0 60 28" width="240" height="112" aria-hidden="true"><g fill="#f4efe6"><rect x="34" y="4" width="1" height="1"/><rect x="44" y="8" width="1" height="1"/><rect x="52" y="3" width="1" height="1"/><rect x="40" y="14" width="1" height="1"/><rect x="55" y="12" width="1" height="1"/><rect x="48" y="18" width="1" height="1"/></g><g fill="#ffc23d"><rect x="38" y="6" width="1" height="1"/><rect x="50" y="15" width="1" height="1"/></g></svg></span>
      <span class="sky clouds"><svg class="px" viewBox="0 0 60 28" width="240" height="112" aria-hidden="true"><g fill="#fff"><rect x="34" y="8" width="12" height="3"/><rect x="37" y="6" width="6" height="2"/><rect x="46" y="15" width="9" height="2"/><rect x="48" y="13" width="4" height="2"/></g></svg></span>
      <span class="knob"><svg class="px" viewBox="0 0 20 20" width="80" height="80" aria-hidden="true">
        <g class="sunpx"><g fill="#ffc23d"><rect x="5" y="4" width="10" height="12"/><rect x="4" y="5" width="12" height="10"/><rect x="3" y="7" width="14" height="6"/></g><g fill="#ff8a3d"><rect x="9" y="0" width="2" height="2"/><rect x="9" y="18" width="2" height="2"/><rect x="0" y="9" width="2" height="2"/><rect x="18" y="9" width="2" height="2"/><rect x="2" y="2" width="2" height="2"/><rect x="16" y="2" width="2" height="2"/><rect x="2" y="16" width="2" height="2"/><rect x="16" y="16" width="2" height="2"/></g><rect x="6" y="6" width="2" height="2" fill="#fff6d0"/></g>
        <g class="moon"><g fill="#f4efe6"><rect x="6" y="3" width="8" height="14"/><rect x="4" y="5" width="12" height="10"/><rect x="3" y="7" width="14" height="6"/></g><g fill="#1d1640"><rect x="10" y="4" width="7" height="9"/><rect x="12" y="3" width="4" height="12"/></g><rect x="6" y="11" width="2" height="2" fill="#cfc8dc"/></g>
      </svg></span>
      <span class="ground"></span>
    </button>
  </div><footer><b>Day / night</b><span class="state" id="s1">off · day</span></footer></article>

  <article class="spec"><div class="stage"><div class="lampwrap" id="lamp">
    <div class="glow"></div>
    <svg class="px" viewBox="0 0 40 46" aria-hidden="true">
      <rect x="19" y="0" width="2" height="8" fill="#5a5366"/>
      <g fill="#7fa8ff"><rect x="10" y="8" width="20" height="3"/><rect x="7" y="11" width="26" height="4"/><rect x="4" y="15" width="32" height="5"/></g>
      <g fill="#5f86d9"><rect x="4" y="18" width="32" height="2"/></g>
      <rect class="bulb" id="bulb" x="16" y="20" width="8" height="5" fill="#5a5366"/>
      <g fill="#2a2733"><rect x="18" y="25" width="4" height="15"/><rect x="10" y="40" width="20" height="4"/></g>
    </svg>
    <button class="cord" id="cord" role="switch" aria-checked="false" aria-label="Lamp"></button>
  </div></div><footer><b>Pull cord</b><span class="state" id="s2">off · pull the cord</span></footer></article>

  <article class="spec"><div class="stage"><div class="catbox">
    <button class="check" role="checkbox" aria-checked="false" id="cat">
      <span class="box">
        <svg class="cat px" viewBox="0 0 14 10" aria-hidden="true"><g fill="#ffc23d"><rect x="1" y="0" width="2" height="2"/><rect x="5" y="0" width="2" height="2"/><rect x="1" y="2" width="6" height="4"/><rect x="3" y="5" width="9" height="3"/><rect x="11" y="2" width="2" height="4"/><rect x="3" y="8" width="2" height="2"/><rect x="9" y="8" width="2" height="2"/></g><g fill="#0f0e13"><rect x="2" y="3" width="1" height="1"/><rect x="5" y="3" width="1" height="1"/></g><rect x="3" y="4" width="2" height="1" fill="#ff5b3a"/></svg>
        <span class="zz" aria-hidden="true">z z</span>
        <svg class="px" viewBox="0 0 16 10" aria-hidden="true"><g fill="#c98a45"><rect x="0" y="2" width="16" height="8"/></g><g fill="#8f5525"><rect x="0" y="2" width="16" height="2"/><rect x="0" y="9" width="16" height="1"/><rect x="7" y="4" width="2" height="5"/></g><g fill="#e0a552"><rect x="-1" y="0" width="5" height="2"/><rect x="12" y="0" width="5" height="2"/></g></svg>
      </span>
      Keep me signed in
    </button>
    <small id="s3">aria-checked="false"</small>
  </div></div><footer><b>Cat in a box</b><span class="state" id="s3b">unchecked</span></footer></article>
</div>
<script>
(() => {
const flip = el => { const on = el.getAttribute("aria-checked") !== "true"; el.setAttribute("aria-checked", String(on)); return on; };
document.getElementById("dn").addEventListener("click", e => { const on = flip(e.currentTarget); document.getElementById("s1").textContent = on ? "on · night" : "off · day"; });
const cord = document.getElementById("cord"), lamp = document.getElementById("lamp"), bulb = document.getElementById("bulb");
cord.addEventListener("click", () => { cord.classList.remove("pull"); void cord.offsetWidth; cord.classList.add("pull"); setTimeout(() => { const on = flip(cord); lamp.classList.toggle("on", on); bulb.setAttribute("fill", on ? "#fff6d0" : "#5a5366"); document.getElementById("s2").textContent = on ? "on · warm light" : "off · pull the cord"; }, 180); });
const cat = document.getElementById("cat");
cat.addEventListener("click", () => { const on = flip(cat); document.getElementById("s3").textContent = `aria-checked="${on}"`; document.getElementById("s3b").textContent = on ? "checked · cat is in" : "unchecked"; });
// in a gallery preview nobody clicks, so the switches demonstrate themselves until touched
let touched = false; addEventListener("pointerdown", () => touched = true, { once:true }); addEventListener("keydown", () => touched = true, { once:true });
const demo = [document.getElementById("dn"), cord, cat]; let k = 0;
const timer = setInterval(() => { if(touched || matchMedia("(prefers-reduced-motion: reduce)").matches){ clearInterval(timer); return; } demo[k % 3].click(); k++; }, 1400);
})();
</script>
</body>
</html>
