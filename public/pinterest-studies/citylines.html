<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Citylines — one stop at a time</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f6f5ef;color:#151511}body{font-family:Arial,sans-serif}.page{max-width:1440px;margin:auto;overflow:hidden}nav{height:78px;margin:0 8%;display:flex;align-items:center;justify-content:space-between;font-size:13px}.brand{font-weight:700;font-size:16px;letter-spacing:-.04em}.brand i{display:inline-grid;place-items:center;width:19px;height:19px;border:1.5px solid;border-radius:50%;font-style:normal;margin-right:7px}.links{display:flex;gap:26px}.links a,nav a{color:inherit;text-decoration:none}.app,.outline{border:1px solid #222;border-radius:30px;padding:10px 18px;background:transparent}.dots{height:28px;margin:0 8%;background-image:radial-gradient(#34342e 1.5px,transparent 1.7px);background-size:9px 9px;mask-image:linear-gradient(90deg,#000 0 35%,transparent 43%,#000 59%)}main{text-align:center;padding-top:35px}.eyebrow{font:10px monospace;letter-spacing:.16em;color:#85847b}.eyebrow b{color:#dd8a4e}h1{font:clamp(36px,4.2vw,65px)/1.05 Georgia,serif;letter-spacing:-.055em;font-weight:400;margin:23px 0 17px}h1 em{color:#444fb7;font-weight:400}p{font-size:14px;line-height:1.6;color:#74746d;max-width:410px;margin:0 auto}.actions{display:flex;justify-content:center;gap:8px;margin-top:20px}.actions a,.actions button{font:11px Arial;cursor:pointer;text-decoration:none}.primary{border:1px solid #111;background:#111;color:white;border-radius:30px;padding:12px 20px}.scene{position:relative;margin-top:12px;width:100%;overflow:hidden}.scene img{display:block;width:100%;height:auto}.train-track{position:absolute;left:53%;right:-7%;top:66%;height:12%;transform:rotate(-10deg);transform-origin:left center;overflow:hidden}.train{position:absolute;top:0;left:0;width:75%;height:65%;display:flex;animation:ride 12s cubic-bezier(.37,0,.63,1) infinite}.car{flex:1;position:relative;background:#f5f3e9;border:2px solid #161616;border-radius:9px 8px 3px 3px;margin-right:2px;box-shadow:inset 0 -5px #b5b4aa,0 2px #111}.car:before{content:"";position:absolute;inset:19% 5% 35%;background:repeating-linear-gradient(90deg,#161616 0 12%,transparent 12% 16%);border-bottom:1px solid #333}.car:after{content:"";position:absolute;bottom:-6px;left:13%;right:13%;height:5px;border-radius:50%;background:#171717}@keyframes ride{0%{transform:translateX(-105%)} 15%{transform:translateX(-55%)} 44%,52%{transform:translateX(40%)} 100%{transform:translateX(170%)}}
.car:first-child{border-radius:14px 5px 3px 3px}.car:last-child{border-radius:5px 14px 3px 3px}.car{box-shadow:inset 0 -5px #b5b4aa,0 2px #111,0 4px 1px #555}.car:before{background:repeating-linear-gradient(90deg,#181c23 0 11%,#f5f3e9 11% 16%);border-top:2px solid #b6afa0}.train:after{content:"";position:absolute;left:2%;right:2%;bottom:-8px;height:3px;background:repeating-linear-gradient(90deg,#191919 0 8%,transparent 8% 20%)}
.route{height:28px;margin:0 8%;position:relative;overflow:hidden}.route .dots{position:absolute;inset:0;margin:0}.route-signal{position:absolute;left:0;top:4px;width:72px;height:17px;background:radial-gradient(#e18e50 1.5px,transparent 2px);background-size:9px 9px;animation:signal 12s linear infinite}@keyframes signal{from{transform:translateX(-100%)}to{transform:translateX(1300%)}}
.birds{position:absolute;inset:9% 0 auto;pointer-events:none;animation:birds 18s linear infinite}.birds svg{width:80px;display:block;stroke:#171714;fill:none;stroke-width:2.5}.birds.second{top:18%;animation-duration:24s;animation-delay:-11s;transform:scale(.65)}@keyframes birds{from{translate:110vw 0}to{translate:-120px -25px}}.spark{position:absolute;color:#4a56b6;font-size:18px;animation:twinkle 3s ease-in-out infinite alternate}.spark.one{left:14%;top:5%}.spark.two{right:12%;top:13%;animation-delay:-1.5s}@keyframes twinkle{to{transform:scale(.55) rotate(45deg);opacity:.4}}
.scene img{transition:transform 1.4s cubic-bezier(.2,.7,.2,1);transform:scale(1.001)}.scene:hover img{transform:scale(1.012)}.primary,.outline,.app{transition:background .25s,color .25s,transform .25s}.primary:hover{background:#454fb0;border-color:#454fb0;transform:translateY(-2px)}.outline:hover,.app:hover{background:#171714;color:white}.links a{position:relative}.links a:after{content:"";position:absolute;bottom:-5px;left:0;right:0;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .25s}.links a:hover:after,.links a:focus-visible:after{transform:scaleX(1)}.status{font:10px monospace;letter-spacing:.1em;color:#77766d;margin-top:12px;min-height:1em}.status span{color:#4452aa}.is-paused .train,.is-paused .route-signal,.is-paused .birds,.is-paused .spark{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.train{animation:none;transform:translateX(15%)}.route-signal,.birds,.spark{animation:none}.scene img{transition:none}}@media(max-width:650px){nav{margin:0 5%}.links{gap:10px}.dots{margin:0 5%}main{padding:25px 16px 0}.scene{width:145%;margin-left:-22.5%}h1{font-size:38px}}
@media (min-width: 651px) and (min-height: 500px){
.page{min-height:100svh;display:flex;flex-direction:column}

</style></head><body><div class="page"><nav><a class="brand" href="#top"><i>↗</i>Citylines</a><div class="links"><a href="#walks">Walks</a><a href="#walks">Stations</a><a href="#walks">Food</a><a href="#walks">About</a></div><a class="app" href="#walks">Get the app</a></nav><div class="route" aria-hidden="true"><div class="dots"></div><div class="route-signal"></div></div><main id="top"><div class="eyebrow"><b>●</b> LINE 1 · 37 STOPS · 42 KM</div><h1>The whole city, <em>one stop</em> at a time</h1><p>Short walks, old buildings and good food near every<br> metro station. Get off anywhere and we'll show you what's<br> worth seeing.</p><div class="actions"><a class="primary" href="#walks">Start a walk &nbsp; →</a><button class="outline" id="send">Send a train</button></div><div class="status" aria-live="polite">NEXT TRAIN <span>●</span> EN ROUTE</div></main><div class="scene" id="walks"><img src="citylines-city.png" alt="A screen-printed city skyline with a domed building, trees, and an elevated railway"><span class="spark one" aria-hidden="true">✧</span><span class="spark two" aria-hidden="true">✧</span><div class="birds" aria-hidden="true"><svg viewBox="0 0 100 20"><path d="M1 11 Q8 3 16 11 Q24 3 32 11 M49 15 Q54 10 59 15 Q64 10 69 15"/></svg></div><div class="birds second" aria-hidden="true"><svg viewBox="0 0 100 20"><path d="M1 11 Q8 3 16 11 Q24 3 32 11 M49 15 Q54 10 59 15 Q64 10 69 15"/></svg></div><div class="train-track" aria-hidden="true"><div class="train" id="train"><div class="car"></div><div class="car"></div><div class="car"></div><div class="car"></div><div class="car"></div></div></div></div></div><script>
const train=document.getElementById('train'), send=document.getElementById('send'), status=document.querySelector('.status');
send.addEventListener('click',()=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches){status.textContent='MOTION IS REDUCED IN YOUR DEVICE SETTINGS';return}train.style.animation='none';void train.offsetWidth;train.style.animation='';status.textContent='NEXT TRAIN ● DEPARTING NOW';});
train.addEventListener('animationiteration',()=>{status.innerHTML='NEXT TRAIN <span>●</span> EN ROUTE'});
const scene=document.querySelector('.scene');let visible=true;function update(){document.body.classList.toggle('is-paused',document.hidden||!visible)}
new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;update()},{threshold:0}).observe(scene);document.addEventListener('visibilitychange',update);
</script></body></html>
