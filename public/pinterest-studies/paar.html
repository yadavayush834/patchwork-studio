<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paar — worlds built from questions</title><style>
@font-face{font-family:Outfit;src:url('/fonts/Outfit.ttf')}*{box-sizing:border-box}html,body{margin:0;background:#efedea;color:#080808;font-family:Outfit,Arial,sans-serif}header{height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 6.7%}.logo{font:italic 24px Georgia;letter-spacing:-2px;text-decoration:none;color:inherit}.nav{display:flex;align-items:center;gap:24px}.talk{border:1px solid #c8c6c2;padding:12px 24px;border-radius:30px;text-decoration:none;color:inherit}.talk:before{content:'●';color:#39df61;margin-right:10px;font-size:11px}.menu{border:0;background:none;font:inherit;cursor:pointer}.menu i{display:inline-block;width:28px;height:12px;margin-left:15px;border-block:2px solid;vertical-align:middle}.menu-panel{position:absolute;right:6%;top:75px;z-index:4;background:#111;color:#fff;padding:22px 30px;border-radius:16px}.menu-panel a{color:white;display:block;padding:8px;text-decoration:none}.menu-panel[hidden]{display:none}main{width:min(1420px,76%);margin:auto}.intro{display:grid;grid-template-columns: minmax(0,64fr) minmax(0,36fr);align-items:end;gap:20px}.intro h1{font-size:clamp(42px,3.65vw,70px);line-height:1.04;letter-spacing:-.045em;font-weight:500;margin:0 0 32px}.intro p{font-size:19px;line-height:1.55;color:#777;margin:0 0 35px;max-width:520px}.intro strong{color:#444;font-weight:500}.grid{display:grid;grid-template-columns: 48% 17% 17% 18%;grid-template-rows: 265px 260px;gap:0;align-items:center}.art{background:#000;border:0;border-radius:28px;overflow:hidden;position:relative;width:100%;height:100%;padding:0;cursor:pointer;transition:transform .7s cubic-bezier(.2,.8,.2,1),border-radius .7s}.art:hover{transform:scale(.97)}canvas{width:100%;height:100%;display:block}.major{grid-column:1;grid-row:1}.minor{grid-column:3;grid-row:1;width:100%;justify-self:center;height:70%}.earth{grid-column:2;grid-row:2;width:100%;height:100%}.saturn{grid-column:4;grid-row:2;width:100%;height:98%;justify-self:end}.label{font-size:46px;line-height:1;text-align:center;cursor:pointer;background:none;border:0;font-family:inherit}.label small{display:block;font:10px monospace;letter-spacing:.15em;color:#888;margin-top:14px}.stories{grid-column:2;grid-row:1}.brands{grid-column:3;grid-row:2;justify-self:center}.tag{grid-column:1;grid-row:2;font-size:34px;line-height:1.05;align-self:center}.tag i{display:inline-grid;place-items:center;font-style:normal;font-size:30px;margin-left:12px;background:conic-gradient(#f0ceae,#76ffb8,#f57564,#f0ceae);width:50px;height:50px;border-radius:50%}.grid.compact .minor,.grid.compact .earth{transform:scale(.08);opacity:0;pointer-events:none}.grid.compact .major{width:150%;z-index:1}.grid.compact .saturn{width:140%;z-index:1}.grid.compact .stories{transform:translate(-35%,120%)}.grid.compact .brands{transform:translate(-45%,-110%)}.label{transition:transform .8s cubic-bezier(.2,.8,.2,1)}.art{transition:transform .8s cubic-bezier(.2,.8,.2,1),width .8s cubic-bezier(.2,.8,.2,1),opacity .5s}.tip{font:11px monospace;letter-spacing:.1em;color:#999;margin:24px 0}.menu:focus-visible,.art:focus-visible,.label:focus-visible,.talk:focus-visible{outline:3px solid #47d5a6;outline-offset:4px}@media(max-width:800px){header{padding:0 5%;height:70px}main{width:90%}.intro{display:block}.intro h1{font-size:42px}.intro p{font-size:16px}.grid{grid-template-columns:1fr 1fr;grid-template-rows:200px 200px 200px;gap:12px}.major{grid-column:1/3}.minor{grid-column:2;grid-row:2;width:100%;height:100%}.earth{grid-column:1;grid-row:3}.saturn{grid-column:2;grid-row:3;width:100%}.stories,.brands{display:none}.tag{grid-column:1;grid-row:2;font-size:26px}.grid.compact .major,.grid.compact .saturn{width:100%}.grid.compact .minor,.grid.compact .earth{transform:none;opacity:1}}@media(prefers-reduced-motion:reduce){.art,.label{transition:none}}
</style></head><body><header><a href="#top" class="logo">paar°</a><div class="nav"><a class="talk" href="mailto:hello@paar.studio">Let's talk</a><button class="menu" aria-expanded="false" aria-controls="menu">menu <i></i></button></div><div class="menu-panel" id="menu" hidden><a href="#stories">Stories</a><a href="#brands">Brands</a><a href="mailto:hello@paar.studio">Contact</a></div></header><main id="top"><div class="intro"><h1>Worlds built from questions<br>no one has answered.</h1><p>Paar is a <strong>creative strategy and storytelling studio</strong> building <strong>cinematic stories, brand universes and interactive experiences.</strong></p></div><section class="grid" aria-label="Explore Paar's creative worlds"><button class="art major" aria-label="Explore immersive experiences"><canvas data-scene="galaxy"></canvas></button><button class="label stories" id="stories">Stories<small>CINEMA · FILM</small></button><button class="art minor" aria-label="Explore stories"><canvas data-scene="nebula"></canvas></button><div class="tag">Immersive<br> experiences <i>✱</i></div><button class="art earth" aria-label="Explore brand universes"><canvas data-scene="earth"></canvas></button><button class="label brands" id="brands">Brands<small>UNIVERSES</small></button><button class="art saturn" aria-label="Explore brands"><canvas data-scene="saturn"></canvas></button></section><p class="tip">MOVE OVER A WORLD TO EXPLORE ↗</p></main><script>
const menu=document.querySelector('.menu'),panel=document.querySelector('.menu-panel');menu.addEventListener('click',()=>{panel.hidden=!panel.hidden;menu.setAttribute('aria-expanded',String(!panel.hidden))});panel.addEventListener('click',()=>{panel.hidden=true;menu.setAttribute('aria-expanded','false')});
const grid=document.querySelector('.grid');document.querySelectorAll('.stories,.brands,.major,.saturn').forEach(el=>{el.addEventListener('pointerenter',()=>grid.classList.add('compact'));el.addEventListener('click',()=>grid.classList.add('compact'))});
grid.addEventListener('pointerleave',()=>grid.classList.remove('compact'));const canvases=[...document.querySelectorAll('canvas')], reduced=matchMedia('(prefers-reduced-motion: reduce)');let visible=true,frame=0;const rand=(n)=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function render(c,t){const ctx=c.getContext('2d'),w=c.width= Math.max(1,Math.round(c.clientWidth)),h=c.height=Math.max(1,Math.round(c.clientHeight));ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);let type=c.dataset.scene;const step=Math.max(4,Math.round(w/100));const pixel=(x,y,col,a=1)=>{ctx.globalAlpha=a;ctx.fillStyle=col;ctx.fillRect(Math.round(x/step)*step,Math.round(y/step)*step,step*.78,step*.78)};for(let i=0;i<28;i++)pixel(rand(i+20)*w,rand(i+200)*h,'#c2fff6',.2+rand(i+9)*.8);const orb=(cx,cy,r,kind,seed)=>{for(let y=-r;y<=r;y+=step)for(let x=-r;x<=r;x+=step){let nx=x/r,ny=y/r,d=nx*nx+ny*ny;if(d>1)continue;let v=rand(seed+Math.round(x/step)*53+Math.round(y/step)*101),light=Math.sqrt(1-d),col;if(kind==='earth'){let land=Math.sin(nx*10+t*.5)+Math.sin(ny*11+nx*5+t*.3)+Math.sin((nx+ny)*16);col=land>1?'#f6fcf8':v>.45?'#0056ff':'#00dbd2'}else if(kind==='saturn')col=v>.5?'#f7dda0':'#aa8a50';else col=(Math.sin(ny*17+t*.2)>0)?(v>.4?'#f8d8a8':'#d65b38'):(v>.35?'#fff2db':'#a34b30');pixel(cx+x,cy+y,col,Math.min(1,.25+light*.95));}};if(type==='galaxy'||type==='nebula'){let cx=w*(type==='galaxy'?.4:.5),cy=h*.5,rx=w*(type==='galaxy'?.27:.42),ry=h*.44;for(let i=0;i<1300;i++){let a=rand(i+1)*6.28, r=Math.sqrt(rand(i+1200)), twist=a+r*5+t*.12,x=Math.cos(a)*r*rx,y=Math.sin(a)*r*ry;let density=rand(i+500);if(density>1-r*.45)continue;let cols=['#fff','#eee','#cfa9e5','#ff54bf','#fff','#52ded4'];pixel(cx+x+Math.sin(twist)*r*step,cy+y,cols[Math.floor(rand(i+60)*cols.length)],.2+(1-r)*.8)}if(type==='galaxy'){orb(w*.82,h*.48,Math.min(w*.10,h*.32),'planet',7);if(w/h>2.8)orb(w*.98,h*.49,h*.22,'planet',9)}}else{let r=Math.min(w,h)*.36;if(type==='saturn'){ctx.save();ctx.translate(w*.5,h*.51);ctx.rotate(-.43);ctx.strokeStyle='#b49251';ctx.lineWidth=step*2;ctx.setLineDash([step*1.2,step*.5]);ctx.beginPath();ctx.ellipse(0,0,r*1.5,r*.44,0,0,Math.PI*2);ctx.stroke();ctx.restore()}orb(w*.5,h*.5,r,type,22)}ctx.globalAlpha=1}
function tick(t){if(!visible||document.hidden)return;if(frame++%3===0)canvases.forEach(c=>render(c,t/1000));if(!reduced.matches)requestAnimationFrame(tick)}new IntersectionObserver(e=>{visible=e[0].isIntersecting;if(visible)requestAnimationFrame(tick)}).observe(grid);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&visible)requestAnimationFrame(tick)});
</script></body></html>
