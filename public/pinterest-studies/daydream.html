<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Daydream Society</title><style>*{box-sizing:border-box}body{margin:0;background:#eee1c9;color:#111;font-family:Arial,sans-serif}.hero{position:relative;min-height:100vh;background:#eee1c9 url('./daydream-art.png') center/cover;overflow:hidden}header{position:relative;z-index:2;display:flex;justify-content:space-between;padding:22px 3%;font:10px monospace;letter-spacing:1px}header button{background:none;border:0;cursor:pointer;font:inherit}.type{position:absolute;left:3%;right:3%;top:15%;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}h1{font:900 clamp(70px,13vw,190px)/.8 Impact,'Arial Narrow',sans-serif;letter-spacing:-3px;margin:0}h1:first-child{position:absolute;left:0;top:0;white-space:nowrap;transform:scaleX(.36) scaleY(1.45);transform-origin:left top}h1:last-child{position:absolute;right:0;top:0;text-align:right;white-space:nowrap;transform:scaleX(.42) scaleY(1.35);transform-origin:right top;font-size:clamp(55px,9vw,130px)}.note{position:absolute;left:3%;bottom:20%;font:italic 13px/1.4 Georgia;max-width:140px}.story{position:absolute;left:3%;bottom:5%;display:grid;gap:8px}.story button{font:9px monospace;text-align:left;border:1px solid #a9a398;background:#f7eedc;padding:8px 14px;cursor:pointer}.story button[aria-pressed=true]{background:#f2a6a8}.enter{position:absolute;right:10%;bottom:8%;border:0;border-radius:50%;background:#e996a0;color:white;width:90px;height:90px;font:10px monospace;cursor:pointer}.below{padding:90px 8%;min-height:50vh}.below h2{font:70px Impact}.below p{line-height:1.7;max-width:500px}@media(max-width:700px){header span:nth-child(2),header span:nth-child(4){display:none}.hero{min-height:850px;background-position:center;background-size:auto 75%;background-repeat:no-repeat}h1{font-size:70px}h1:last-child{font-size:45px}.type{top:18%}.note{bottom:20%}.enter{width:65px;height:65px}.story{bottom:4%}}
</style></head><body><main><section class="hero"><header><span>SYS_01 &nbsp; POP.EXE</span><span>CHAPTER_02</span><span>THE DAYDREAM SOCIETY</span><span>VOL_01</span><button id="menu">MENU +</button></header><div class="type"><h1>BEYOND</h1><h1>THE<br>ORDINARY</h1></div><p class="note">The world is bigger when you stop taking it so seriously.</p><div class="story"><button aria-pressed="false">01 / THE GIRL WHO DREAMS</button><button aria-pressed="true">02 / THE CAT WHO KNOWS</button><button aria-pressed="false">03 / THE STORIES WE CHASE</button></div><button class="enter" onclick="document.querySelector('#story').scrollIntoView({behavior:'smooth'})">ENTER<br>THE STORY</button></section><section class="below" id="story"><h2 id="chapter">THE CAT WHO KNOWS.</h2><p>Look closer. Reality is overrated. Follow a curious pair into a world just beyond the ordinary.</p></section></main><script>const names=['THE GIRL WHO DREAMS.','THE CAT WHO KNOWS.','THE STORIES WE CHASE.'];document.querySelectorAll('.story button').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.story button').forEach(x=>x.setAttribute('aria-pressed',false));b.setAttribute('aria-pressed',true);document.querySelector('#chapter').textContent=names[i]});document.querySelector('#menu').onclick=()=>document.querySelector('#story').scrollIntoView({behavior:'smooth'})</script></body></html>
