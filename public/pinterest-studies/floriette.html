<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio — Graphic Design</title><style>
@font-face{font-family:FlorietteScript;src:url("floriette-script.ttf") format("truetype");font-display:swap}:root{--paper:#f4f5ef;--blue:#2687cb;--blue-light:#80c7ed;--sage:#73ac8c;--hero-ratio:736/414}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--blue)}body{min-height:100svh;display:grid;place-items:center;font-family:Georgia,'Times New Roman',serif}.hero{background:linear-gradient(#f4f5ef77,#f4f5ef77),url("floriette-paper.png") center/cover;container-type:inline-size;position:relative;width:min(100vw,177.777svh);aspect-ratio:var(--hero-ratio);isolation:isolate;overflow:hidden}.period{position:absolute;top:3.5%;left:42%;font-size:2.4cqw;font-style:italic;letter-spacing:-.06em}.period span{display:inline-block;transform:scaleX(1.5);padding:0 .4em}.seal{position:absolute;right:4.6%;top:5.2%;border:1px solid var(--blue-light);border-radius:50%;padding:.25em .55em;font-size:1.7cqw;transform:rotate(-5deg);font-weight:400}.title{position:absolute;left:8%;top:13%;width:84%;height:28%;margin:0;z-index:1;text-align:center;font-family:FlorietteScript,cursive;font-size:17.8cqw;line-height:.95;font-weight:400;letter-spacing:-.035em;color:#2188d7;text-shadow:0 1px 0 #a0e2ff,0 3px 13px #4eaff26b;white-space:nowrap}.title span{display:inline-block}.title .star{position:absolute;font:2cqw Georgia,serif;left:54%;top:34%;text-shadow:none}.flourish{position:absolute;left:15%;top:25%;width:70%;height:12%;z-index:1;pointer-events:none;overflow:visible}.flourish path{fill:none;stroke:#238ed8;stroke-width:1.2;opacity:.65}.art{position:absolute;left:0;top:30.3%;width:100%;height:58.5%;margin:0;z-index:2;transform:translate(var(--art-x,0px),var(--art-y,0px));transition:transform .7s cubic-bezier(.2,.7,.2,1);pointer-events:none}.art{clip-path:polygon(0 0,30% 0,30% 17%,70% 17%,70% 0,100% 0,100% 100%,0 100%)}.art img{width:100%;height:100%;object-fit:fill;display:block}.spark{position:absolute;right:9.1%;top:49%;width:2cqw;height:2cqw;z-index:3;filter:drop-shadow(0 0 5px #fff);animation:glimmer 4s ease-in-out infinite;pointer-events:none}.spark:before,.spark:after{content:'';position:absolute;inset:0;background:white;clip-path:polygon(50% 0,58% 40%,100% 50%,58% 59%,50% 100%,42% 60%,0 50%,41% 41%)}.spark:after{transform:rotate(45deg) scale(.5)}@keyframes glimmer{0%,100%{opacity:.25;transform:scale(.7) rotate(-10deg)}50%{opacity:.9;transform:scale(1.15) rotate(10deg)}}.caption{position:absolute;bottom:3.7%;left:28%;width:44%;text-align:center;z-index:4}.caption h2{font-size:2.15cqw;letter-spacing:.015em;font-weight:400;margin:0 0 .2em;word-spacing:.6em}.caption p{font-family:Arial,sans-serif;font-size:1.1cqw;letter-spacing:.03em;color:#86b8d5;margin:0}.signature,.collection{position:absolute;bottom:3.2%;font-size:3.7cqw;font-family:'Noto Serif CJK TC','Songti TC','Times New Roman',serif;font-weight:400;letter-spacing:.1em;z-index:4;margin:0;transform:scaleX(.7);transform-origin:center}.signature{left:26%}.collection{right:25.5%}.caption{bottom:4.3%}.signature{left:26.8%;transform:translateX(-50%) scaleX(.7)}.collection{right:25.3%;transform:translateX(50%) scaleX(.7)}.is-paused .spark{animation-play-state:paused}@media(prefers-reduced-motion:reduce){.art{transition:none;transform:none}.spark{animation:none;opacity:.7}}
</style></head><body><main class="hero" aria-label="Botanical graphic design portfolio cover"><div class="period">(2022 <span>⟶</span> 2024)</div><div class="seal">© NINI</div><h1 class="title"><span>Portfolio</span><span class="star" aria-hidden="true">✦</span></h1><svg class="flourish" viewBox="0 0 600 60" aria-hidden="true"><path d="M4 40 C45 63 75 3 130 25 S208 69 264 35 M355 37 C410 5 448 59 500 32 S565 20 596 38"/></svg><figure class="art"><img src="floriette-botanical.png" alt="A white iris between curling green stems, heart-shaped leaves and floating petals against a blue sunset panorama"></figure><span class="spark" aria-hidden="true"></span><p class="signature" lang="zh-Hant">周薇妮</p><footer class="caption"><h2>GRAPHIC DESIGN</h2><p>Graphic / Visual / Branding / Illustration</p></footer><p class="collection" lang="zh-Hant">作品集</p></main><script src="floriette-gsap.min.js"></script><script>
const hero=document.querySelector('.hero'),art=document.querySelector('.art'),reduce=matchMedia('(prefers-reduced-motion: reduce)');
if(window.gsap){const mm=gsap.matchMedia();mm.add('(prefers-reduced-motion: no-preference)',()=>{const intro=gsap.timeline();intro.from('.period,.seal',{autoAlpha:0,y:8,duration:.7,stagger:.12,ease:'power2.out'}).from('.title span:first-child',{autoAlpha:0,y:24,scale:.98,duration:1.1,ease:'power3.out'},'-=.4').from('.flourish',{autoAlpha:0,scaleX:.7,transformOrigin:'center',duration:1},'-=.8').from(art,{autoAlpha:0,y:18,duration:1.15,ease:'power2.out'},'-=.7').from('.signature,.caption,.collection',{autoAlpha:0,y:8,stagger:.12,duration:.65},'-=.55');const x=gsap.quickTo(art,'x',{duration:1,ease:'power3.out'}),y=gsap.quickTo(art,'y',{duration:1,ease:'power3.out'});const move=e=>{const r=hero.getBoundingClientRect();x((e.clientX-r.left-r.width/2)/r.width*8);y((e.clientY-r.top-r.height/2)/r.height*5)};const leave=()=>{x(0);y(0)};hero.addEventListener('pointermove',move,{passive:true});hero.addEventListener('pointerleave',leave);return()=>{hero.removeEventListener('pointermove',move);hero.removeEventListener('pointerleave',leave)}})}
document.addEventListener('visibilitychange',()=>hero.classList.toggle('is-paused',document.hidden));
</script></body></html>
